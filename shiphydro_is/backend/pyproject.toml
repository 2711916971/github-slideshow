[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiphydro-backend"
version = "0.1.0"
description = "ShipHydro-IS backend services"
readme = "README.md"
authors = [{name = "ShipHydro Team"}]
requires-python = ">=3.11"
dependencies = [
    "typing-extensions"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
pythonpath = ["app", "adapters", "core", "storage", "workers"]
