version: "3.9"
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
  openfoam:
    build:
      context: ..
      dockerfile: deploy/docker/openfoam.Dockerfile
